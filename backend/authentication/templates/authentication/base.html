{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Videoflix
      {% endblock %}
    </title>
  </head>

  <body style="
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #2d2d2d;
      background-color: #ffffff;
    ">
    <main style="padding: 32px;">
      <img class="logo" src="{% static 'authentication/images/Logo.svg' %}" alt="Videoflix Logo" style="
        display: block;
        width: 280px;
        max-width: 100%;
        height: auto;
        margin: 0 auto 24px auto;
      " />
      {% block content %}

      {% endblock %}
    </main>
  </body>
</html>
